# Supabase project config. Links this directory to the remote project so
# `supabase db push` knows where to apply migrations from supabase/migrations/.
# project_id is the project ref (matches SUPABASE_URL: https://<ref>.supabase.co).
# Replace with your own project ref, or run: supabase link --project-ref YOUR_PROJECT_REF
project_id = "YOUR_PROJECT_REF"
