# App-behavior settings for the weekly schedule generator.
#
# Household data (people, schedules, recurring events, pets, dinner defaults)
# now lives in Supabase via the family-calendar extension. This file holds
# only the app-behavior settings: output format, group name, regex filters,
# and the emoji map.
#
# Secrets (API keys, Supabase URL/key) live in .env — this file is safe to commit.

# Items not yet stored in Supabase that still come from yaml:
dinner:
  # Days where no fixed cook is assigned — generator picks A or J.
  negotiable: [wednesday, thursday, friday, saturday, sunday]
  # Constraint string surfaced in the Claude prompt.
  constraint: "All dinners must be assigned before primary scheduler grocery shops on Sat/Sun"

schedule_output:
  # Format options: "bullets" (day headers with bullet points),
  #                 "person"  (grouped by person),
  #                 "grid"    (compact text table)
  format: "bullets"
  group_name: "Family Chat"
  pin: true

  # Additional regex patterns to filter out of GCal results.
  # Built-in filters: birthday, therapist, weekly meeting, "ask before scheduling".
  excluded_events:
    - "(?i)zoe\\s*r"  # example: filter out therapist name

  # Emojis used in the generated schedule.
  emoji_map:
    swim: "🏊"
    pool: "🎱"
    forest_school: "🌳"
    dog: "🐕"
    gym: "🏋️"
    chicken: "🐔"
    cleaner: "🧹"
    urgent: "‼️"
    coop: "🛒"
    babysitting: "🐣"
    family_dinner: "🍽️"
